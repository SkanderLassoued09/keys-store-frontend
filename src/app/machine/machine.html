<p-toolbar class="mb-6">
    <ng-template #start>
        <p-button label="Nouvelle machine" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
    </ng-template>

    <ng-template #end>
        <p-fileUpload mode="basic" accept=".csv,.xlsx" [maxFileSize]="1000000" label="Import" chooseLabel="Import" auto customUpload class="mr-2 inline-block" [chooseButtonProps]="{ severity: 'secondary' }" />
    </ng-template>
</p-toolbar>

<p-table
    #dt
    [value]="(machine$ | async) || []"
    [loading]="(loading$ | async) || false"
    [rows]="10"
    [paginator]="true"
    [rowHover]="true"
    dataKey="_id"
    [tableStyle]="{ 'min-width': '75rem' }"
    [globalFilterFields]="['name', 'type', 'serialNumber', 'fournisseur.name', 'status']"
    currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} entrées"
    [showCurrentPageReport]="true"
>
    <ng-template pTemplate="caption">
        <div class="flex justify-end">
            <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Rechercher..." />
        </div>
    </ng-template>

    <!-- TABLE HEADER -->
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 3rem"><p-tableHeaderCheckbox /></th>
            <th>Nom</th>
            <th>Type</th>
            <th>N° de série</th>
            <th>Fournisseur</th>
            <th>Date d'achat</th>
            <th>Statut</th>
            <th style="min-width: 10rem">Actions</th>
        </tr>
    </ng-template>

    <!-- TABLE BODY -->
    <ng-template pTemplate="body" let-item>
        <tr>
            <td><p-tableCheckbox [value]="item" /></td>
            <td>{{ item.name || '-' }}</td>
            <td>{{ item.type || '-' }}</td>
            <td>{{ item.serialNumber || '-' }}</td>
            <td>{{ item.fournisseur?.name || '-' }}</td>
            <td>{{ item.purchaseDate ? (item.purchaseDate | date: 'dd/MM/yyyy') : '-' }}</td>
            <td>
                <p-tag [value]="getStatusLabel(item.status)" [severity]="getStatusSeverity(item.status)" />
            </td>
            <td>
                <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" (click)="editMachine(item)" pTooltip="Modifier" />
                <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" pTooltip="Supprimer" (click)="deleteMachine(item)" />
            </td>
        </tr>
    </ng-template>
    <!-- EMPTY MESSAGE -->
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="6" class="text-center">Aucun machine trouvé.</td>
        </tr>
    </ng-template>
</p-table>

<!-- MACHINE DIALOG -->
<p-dialog [(visible)]="machineDialog" [style]="{ width: '700px' }" [header]="getDialogTitle()" [modal]="true" [closable]="true" styleClass="machine-dialog">
    <form [formGroup]="machineForm" class="machine-form" (ngSubmit)="saveMachine()">
        <!-- Basic Information Section -->
        <div class="form-section">
            <label class="section-label">Informations de base</label>

            <div class="form-row">
                <div class="form-field flex-2">
                    <label for="name">Nom <span class="required">*</span></label>
                    <input id="name" type="text" pInputText formControlName="name" placeholder="Nom de la machine" />
                    <small class="error-message" *ngIf="submitted && machineForm.get('name')?.invalid"> Le nom est obligatoire </small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="type">Type</label>
                    <input id="type" type="text" pInputText formControlName="type" placeholder="Type de machine" />
                </div>

                <div class="form-field">
                    <label for="serialNumber">N° de série</label>
                    <input id="serialNumber" type="text" pInputText formControlName="serialNumber" placeholder="Numéro de série" />
                </div>
            </div>
        </div>

        <!-- Provider & Purchase Section -->
        <div class="form-section">
            <label class="section-label">Fournisseur et achat</label>

            <div class="form-row">
                <div class="form-field flex-2">
                    <label for="fournisseur">Fournisseur</label>
                    <p-select
                        id="fournisseur"
                        [options]="(provider$ | async) || []"
                        formControlName="fournisseur"
                        optionLabel="name"
                        optionValue="id"
                        placeholder="Sélectionner un fournisseur"
                        [filter]="true"
                        filterPlaceholder="Rechercher..."
                        [showClear]="true"
                    />
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="purchaseDate">Date d'achat</label>
                    <p-datepicker id="purchaseDate" formControlName="purchaseDate" dateFormat="dd/mm/yy" [showIcon]="true" placeholder="Sélectionner une date" [showButtonBar]="true" />
                </div>
            </div>
        </div>

        <!-- Status Section -->
        <div class="form-section">
            <label class="section-label">Statut</label>

            <div class="form-row">
                <div class="form-field">
                    <label for="status">Statut <span class="required">*</span></label>
                    <p-select id="status" formControlName="status" [options]="statusOptions" optionLabel="label" optionValue="value" placeholder="Sélectionner un statut" />
                </div>
            </div>
        </div>
    </form>

    <ng-template #footer>
        <div class="dialog-footer">
            <p-button label="Annuler" icon="pi pi-times" [text]="true" severity="secondary" (click)="hideDialog()" />
            <p-button [label]="getSaveButtonLabel()" [icon]="isEditMode ? 'pi pi-save' : 'pi pi-check'" severity="primary" (click)="saveMachine()" [disabled]="machineForm.invalid" />
        </div>
    </ng-template>
</p-dialog>

<p-toast />
<p-confirmDialog [style]="{ width: '450px' }" />
