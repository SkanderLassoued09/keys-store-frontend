<p-toolbar class="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
        <!-- <p-button severity="danger" label="Delete" icon="pi pi-trash" outlined (onClick)="deleteSelectedProducts()" [disabled]="!selectedProducts || !selectedProducts.length" /> -->
    </ng-template>

    <ng-template #end>
        <p-fileUpload mode="basic" accept="image/*" [maxFileSize]="1000000" label="Import" chooseLabel="Import" auto customUpload class="mr-2 inline-block" [chooseButtonProps]="{ severity: 'secondary' }" />
        <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>

<p-table [value]="providersList" [rows]="10" [paginator]="true" [rowHover]="true" dataKey="id" [tableStyle]="{ 'min-width': '75rem' }" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [showCurrentPageReport]="true">
    <!-- TABLE HEADER -->
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 3rem"><p-tableHeaderCheckbox /></th>

            <th>Name</th>
            <th>E-amil</th>
            <th>Company</th>
            <th>Address</th>
            <th style="min-width: 10rem">Actions</th>
        </tr>
    </ng-template>

    <!-- TABLE BODY -->
    <ng-template pTemplate="body" let-item>
        <tr>
            <td><p-tableCheckbox [value]="item" /></td>

            <td>{{ item.name }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.company }}</td>
            <td>{{ item.address }}</td>

            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" />
            </td>
        </tr>
    </ng-template>
</p-table>

<!--  -->
<p-dialog [(visible)]="providerDialog" [style]="{ width: '500px' }" header="Creation Employé" [modal]="true" [closable]="true">
    <form [formGroup]="providerFrom" class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
        <!-- 🔹 Name -->
        <div>
            <label for="name" class="block font-bold mb-2">Name</label>
            <input id="name" type="text" pInputText formControlName="name" />
            <!-- <small class="text-red-500" *ngIf="submitted && employeeForm.get('name')?.invalid"> Name is required. </small> -->
        </div>
        <!-- 🔹 Name -->
        <div>
            <label for="name" class="block font-bold mb-2">E-mail</label>
            <input id="name" type="lastName" pInputText formControlName="email" />
            <!-- <small class="text-red-500" *ngIf="submitted && employeeForm.get('lastName')?.invalid"> lastName is required. </small> -->
        </div>

        <!-- 🔹 Category -->
        <div>
            <label for="name" class="block font-bold mb-2">Company</label>
            <input id="name" type="text" pInputText formControlName="company" />
            <!-- <small class="text-red-500" *ngIf="submitted && employeeForm.get('phone')?.invalid"> phone is required. </small> -->
        </div>
        <div>
            <label for="name" class="block font-bold mb-2">Address</label>
            <input id="name" type="text" pInputText formControlName="address" />
            <!-- <small class="text-red-500" *ngIf="submitted && employeeForm.get('phone')?.invalid"> phone is required. </small> -->
        </div>
        <div>
            <label for="name" class="block font-bold mb-2">Phone</label>
            <input id="name" type="text" pInputText formControlName="phone" />
            <!-- <small class="text-red-500" *ngIf="submitted && employeeForm.get('phone')?.invalid"> phone is required. </small> -->
        </div>
    </form>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Save" icon="pi pi-check" (click)="saveNewProvider()" />
    </ng-template>
</p-dialog>

<p-confirmDialog [style]="{ width: '450px' }" />
