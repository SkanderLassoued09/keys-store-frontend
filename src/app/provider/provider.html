<p-toolbar class="mb-6">
    <ng-template #start>
        <p-button label="Nouveau" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
    </ng-template>

    <ng-template #end>
        <p-fileUpload mode="basic" accept="image/*" [maxFileSize]="1000000" label="Import" chooseLabel="Import" auto customUpload class="mr-2 inline-block" [chooseButtonProps]="{ severity: 'secondary' }" />
    </ng-template>
</p-toolbar>

<p-table
    #dt
    [value]="(provider$ | async) || []"
    [loading]="(loading$ | async) || false"
    [rows]="10"
    [paginator]="true"
    [rowHover]="true"
    dataKey="_id"
    [tableStyle]="{ 'min-width': '75rem' }"
    [globalFilterFields]="['name', 'company', 'email', 'phone', 'address']"
    currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} entrées"
    [showCurrentPageReport]="true"
>
    <ng-template pTemplate="caption">
        <div class="flex justify-end">
            <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Rechercher..." />
        </div>
    </ng-template>

    <!-- TABLE HEADER -->
    <ng-template pTemplate="header">
        <tr>
            <!-- <th style="width: 3rem"><p-tableHeaderCheckbox /></th> -->
            <th>Nom</th>
            <th>Entreprise</th>
            <th>Email</th>
            <th>Téléphone</th>
            <th>Adresse</th>
            <th style="min-width: 10rem">Actions</th>
        </tr>
    </ng-template>

    <!-- TABLE BODY -->
    <ng-template pTemplate="body" let-item>
        <tr>
            <!-- <td><p-tableCheckbox [value]="item" /></td> -->
            <td>{{ item.name }}</td>
            <td>{{ item.company || '-' }}</td>
            <td>{{ item.email || '-' }}</td>
            <td>{{ item.phone || '-' }}</td>
            <td>{{ item.address || '-' }}</td>
            <td>
                <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" (click)="editProvider(item)" pTooltip="Modifier" />
                <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (click)="deleteProvider(item)" pTooltip="Supprimer" />
            </td>
        </tr>
    </ng-template>
    <!-- EMPTY MESSAGE -->
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="6" class="text-center">Aucun fournisseur trouvé.</td>
        </tr>
    </ng-template>
</p-table>

<!-- PROVIDER DIALOG -->
<p-dialog [(visible)]="providerDialog" [style]="{ width: '600px' }" [header]="getDialogTitle()" [modal]="true" [closable]="true" styleClass="provider-dialog">
    <form [formGroup]="providerForm" class="provider-form" (ngSubmit)="saveProvider()">
        <!-- Basic Information Section -->
        <div class="form-section">
            <label class="section-label">Informations de base</label>

            <div class="form-row">
                <div class="form-field flex-2">
                    <label for="name">Nom <span class="required">*</span></label>
                    <input id="name" type="text" pInputText formControlName="name" placeholder="Ex: Fournisseur ABC" />
                    <small class="error-message" *ngIf="submitted && providerForm.get('name')?.invalid"> Le nom est obligatoire </small>
                </div>

                <div class="form-field">
                    <label for="company">Entreprise</label>
                    <input id="company" type="text" pInputText formControlName="company" placeholder="Ex: ABC SARL" />
                </div>
            </div>
        </div>

        <!-- Contact Information Section -->
        <div class="form-section">
            <label class="section-label">Coordonnées</label>

            <div class="form-row">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input id="email" type="email" pInputText formControlName="email" placeholder="Ex: contact@abc.tn" />
                    <small class="error-message" *ngIf="submitted && providerForm.get('email')?.hasError('email')"> Email invalide </small>
                </div>

                <div class="form-field">
                    <label for="phone">Téléphone</label>
                    <input id="phone" type="text" pInputText formControlName="phone" placeholder="Ex: +216 12 345 678" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="address">Adresse</label>
                    <textarea id="address" pInputTextarea formControlName="address" placeholder="Ex: 123 Rue de la République, Tunis" rows="3"></textarea>
                </div>
            </div>
        </div>
    </form>

    <ng-template #footer>
        <div class="dialog-footer">
            <p-button label="Annuler" icon="pi pi-times" [text]="true" severity="secondary" (click)="hideDialog()" />
            <p-button [label]="getSaveButtonLabel()" [icon]="isEditMode ? 'pi pi-save' : 'pi pi-check'" severity="primary" (click)="saveProvider()" [disabled]="providerForm.invalid" />
        </div>
    </ng-template>
</p-dialog>

<p-toast />
<p-confirmDialog [style]="{ width: '450px' }" />
