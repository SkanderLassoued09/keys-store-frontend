<p-toast />

<p-toolbar class="mb-6">
    <ng-template #start>
        <h2 class="text-xl font-semibold m-0">Catégories</h2>
    </ng-template>
    <ng-template #end>
        <p-button label="Nouvelle catégorie" icon="pi pi-plus" (onClick)="openNew()" />
    </ng-template>
</p-toolbar>

<p-table [value]="(categories$ | async) || []" [loading]="(loading$ | async) || false" [rows]="10" [paginator]="true" [rowHover]="true" dataKey="_id" [tableStyle]="{ 'min-width': '40rem' }">
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 3rem"></th>
            <th style="width: 6rem">Image</th>
            <th>Nom</th>
            <th>Sous-catégories</th>
            <th>Statut</th>
            <th style="width: 10rem">Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row let-expanded="expanded">
        <tr>
            <td>
                <button type="button" class="p-button p-button-text p-button-rounded p-button-sm" [pRowToggler]="row" aria-label="Basculer les sous-catégories">
                    <i [class]="expanded ? 'pi pi-chevron-down' : 'pi pi-chevron-right'"></i>
                </button>
            </td>
            <td>
                <img [src]="row.image || fallbackImage" (error)="onImgError($event)" alt="{{ row.name }}" class="category-thumb" />
            </td>
            <td>{{ row.name }}</td>
            <td>
                <p-tag [value]="subCategoriesFor(row._id).length + ' sous-catégorie(s)'" severity="info" />
            </td>
            <td>
                <p-tag [value]="row.active === false ? 'Inactif' : 'Actif'" [severity]="row.active === false ? 'secondary' : 'success'" />
            </td>
            <td>
                <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" (click)="openEdit(row)" pTooltip="Modifier" />
                <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (click)="remove(row)" pTooltip="Supprimer" />
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="rowexpansion" let-row>
        <tr>
            <td colspan="6">
                <div class="subcat-panel">
                    <div class="flex items-center justify-between mb-3">
                        <h4 class="m-0 font-semibold">Sous-catégories de « {{ row.name }} »</h4>
                        <p-button label="Ajouter une sous-catégorie" icon="pi pi-plus" size="small" (onClick)="openAddSubCategory(row)" />
                    </div>

                    <p-table [value]="subCategoriesFor(row._id)" dataKey="_id" [tableStyle]="{ 'min-width': '30rem' }">
                        <ng-template pTemplate="header">
                            <tr>
                                <th>Nom</th>
                                <th style="width: 8rem">Statut</th>
                                <th style="width: 8rem">Actions</th>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="body" let-sub>
                            <tr>
                                <td>{{ sub.name }}</td>
                                <td>
                                    <p-tag [value]="sub.active === false ? 'Inactif' : 'Actif'" [severity]="sub.active === false ? 'secondary' : 'success'" />
                                </td>
                                <td>
                                    <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" (click)="openEditSubCategory(sub, row)" pTooltip="Modifier" />
                                    <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (click)="removeSubCategory(sub)" pTooltip="Supprimer" />
                                </td>
                            </tr>
                        </ng-template>
                        <ng-template pTemplate="emptymessage">
                            <tr>
                                <td colspan="3" class="text-center text-surface-500">Aucune sous-catégorie. Cliquez sur « Ajouter ».</td>
                            </tr>
                        </ng-template>
                    </p-table>
                </div>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="6" class="text-center">Aucune catégorie enregistrée.</td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="dialogVisible" [modal]="true" [closable]="true" [style]="{ width: '520px' }" [header]="isEditMode ? 'Modifier la catégorie' : 'Nouvelle catégorie'">
    <form [formGroup]="categoryForm" class="flex flex-col gap-4" (ngSubmit)="save()">
        <div class="flex flex-col gap-1">
            <label>Nom <span class="text-red-500">*</span></label>
            <input pInputText formControlName="name" placeholder="Ex: Clé Maison" />
            <small class="text-red-500" *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">Le nom est obligatoire.</small>
        </div>

        <div class="flex flex-col gap-2">
            <label>Image</label>
            <div class="flex items-center gap-3">
                <img [src]="categoryForm.value.image || fallbackImage" (error)="onImgError($event)" alt="aperçu" class="category-thumb" />
                <div class="flex flex-col gap-2 flex-1">
                    <input pInputText formControlName="image" placeholder="URL de l'image (https://...)" />
                    <div class="flex items-center gap-2">
                        <label class="upload-btn">
                            <i class="pi pi-upload"></i> Téléverser
                            <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden />
                        </label>
                        <p-button label="Retirer" icon="pi pi-times" severity="secondary" [text]="true" size="small" (onClick)="clearImage()" />
                    </div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <input id="active" type="checkbox" formControlName="active" />
            <label for="active" class="cursor-pointer">Catégorie active</label>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Annuler" icon="pi pi-times" severity="secondary" [text]="true" (onClick)="closeDialog()" />
        <p-button label="Enregistrer" icon="pi pi-check" (onClick)="save()" [disabled]="categoryForm.invalid || (saving$ | async) || false" [loading]="(saving$ | async) || false" />
    </ng-template>
</p-dialog>

<p-dialog [(visible)]="subDialogVisible" [modal]="true" [closable]="true" [style]="{ width: '460px' }" [header]="subIsEditMode ? 'Modifier la sous-catégorie' : 'Nouvelle sous-catégorie'">
    <form [formGroup]="subCategoryForm" class="flex flex-col gap-4" (ngSubmit)="saveSubCategory()">
        <div class="flex flex-col gap-1">
            <label>Catégorie parente</label>
            <input pInputText [value]="subParentCategoryName" [readonly]="true" />
        </div>

        <div class="flex flex-col gap-1">
            <label>Nom <span class="text-red-500">*</span></label>
            <input pInputText formControlName="name" placeholder="Ex: Clé plate" />
            <small class="text-red-500" *ngIf="subCategoryForm.get('name')?.invalid && subCategoryForm.get('name')?.touched">Le nom est obligatoire.</small>
        </div>

        <div class="flex items-center gap-2">
            <input id="sub-active-inline" type="checkbox" formControlName="active" />
            <label for="sub-active-inline" class="cursor-pointer">Sous-catégorie active</label>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Annuler" icon="pi pi-times" severity="secondary" [text]="true" (onClick)="closeSubDialog()" />
        <p-button label="Enregistrer" icon="pi pi-check" (onClick)="saveSubCategory()" [disabled]="subCategoryForm.invalid" />
    </ng-template>
</p-dialog>

<p-confirmDialog [style]="{ width: '450px' }" />
