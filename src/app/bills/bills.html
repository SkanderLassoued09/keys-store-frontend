<p-toolbar class="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
        <!-- <p-button severity="danger" label="Delete" icon="pi pi-trash" outlined (onClick)="deleteSelectedProducts()" [disabled]="!selectedProducts || !selectedProducts.length" /> -->
    </ng-template>

    <ng-template #end>
        <p-fileUpload mode="basic" accept="image/*" [maxFileSize]="1000000" label="Import" chooseLabel="Import" auto customUpload class="mr-2 inline-block" [chooseButtonProps]="{ severity: 'secondary' }" />
        <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>

<p-table [value]="billList" [rows]="10" [paginator]="true" [rowHover]="true" dataKey="id" [tableStyle]="{ 'min-width': '75rem' }" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries" [showCurrentPageReport]="true">
    <!-- TABLE HEADER -->
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 3rem"><p-tableHeaderCheckbox /></th>

            <th>Title</th>
            <th>Description</th>
            <th>Type</th>

            <th style="min-width: 10rem">Actions</th>
        </tr>
    </ng-template>

    <!-- TABLE BODY -->
    <ng-template pTemplate="body" let-item>
        <tr (click)="onRowClick(item)" style="cursor: pointer">
            <td><p-tableCheckbox [value]="item" /></td>

            <td>{{ item.title }}</td>
            <td>{{ item.description }}</td>
            <td>{{ item.type }}</td>

            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editProduct(item)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteProduct(item)" />
            </td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="billDialog" [style]="{ width: '500px' }" header="Creation Employé" [modal]="true" [closable]="true">
    <form [formGroup]="billForm" class="flex flex-col gap-5">
        <!-- 🔹 Name -->
        <div>
            <label for="name" class="block font-bold mb-2">Name</label>
            <input id="name" type="text" pInputText formControlName="title" />
            <!-- <small class="text-red-500" *ngIf="submitted && employeeForm.get('name')?.invalid"> Name is required. </small> -->
        </div>
        <!-- 🔹 Name -->
        <div>
            <label for="name" class="block font-bold mb-2">Description</label>
            <input id="name" type="lastName" pInputText formControlName="description" />
            <!-- <small class="text-red-500" *ngIf="submitted && employeeForm.get('lastName')?.invalid"> lastName is required. </small> -->
        </div>
        <!-- 🔹 Name -->
        <div>
            <label for="name" class="block font-bold mb-2">Type</label>
            <input id="name" type="text" pInputText formControlName="type" />
            <!-- <small class="text-red-500" *ngIf="submitted && employeeForm.get('phone')?.invalid"> phone is required. </small> -->
        </div>
        <div>
            <label for="name" class="block font-bold mb-2">Type</label>
            <p-fileupload #fu mode="basic" chooseLabel="Choose file" [customUpload]="true" accept="image/*,.pdf,.txt" [maxFileSize]="5242880" (uploadHandler)="onUpload($event)" />

            <p-button label="Upload" (click)="fu.upload()" />
            <!-- <small class="text-red-500" *ngIf="submitted && employeeForm.get('phone')?.invalid"> phone is required. </small> -->
        </div>
    </form>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button label="Save" icon="pi pi-check" (click)="addNewBill()" />
    </ng-template>
</p-dialog>

<p-confirmDialog [style]="{ width: '450px' }" />
