<p-toolbar class="mb-6">
    <ng-template #start>
        <p-button label="Nouveau" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
    </ng-template>

    <ng-template #end>
        <p-fileUpload mode="basic" accept="image/*" [maxFileSize]="1000000" label="Import" chooseLabel="Import" auto customUpload class="mr-2 inline-block" [chooseButtonProps]="{ severity: 'secondary' }" />
        <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>

<p-table
    #dt
    [value]="(clients$ | async) || []"
    [loading]="(loading$ | async) || false"
    [rows]="10"
    [paginator]="true"
    [rowHover]="true"
    dataKey="_id"
    [tableStyle]="{ 'min-width': '75rem' }"
    [globalFilterFields]="['firstName', 'lastName', 'phone', 'address']"
    currentPageReportTemplate="Affichage de {first} à {last} sur {totalRecords} entrées"
    [showCurrentPageReport]="true"
>
    <ng-template pTemplate="caption">
        <div class="flex justify-end">
            <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Rechercher..." />
        </div>
    </ng-template>

    <!-- TABLE HEADER -->
    <ng-template pTemplate="header">
        <tr>
            <th style="width: 3rem">
                <p-tableHeaderCheckbox />
            </th>
            <th pSortableColumn="firstName">
                <div class="flex items-center gap-2">
                    Nom
                    <p-sortIcon field="firstName" />
                </div>
            </th>
            <th pSortableColumn="lastName">
                <div class="flex items-center gap-2">
                    Prénom
                    <p-sortIcon field="lastName" />
                </div>
            </th>
            <th pSortableColumn="phone">
                <div class="flex items-center gap-2">
                    Téléphone
                    <p-sortIcon field="phone" />
                </div>
            </th>
            <th pSortableColumn="address">
                <div class="flex items-center gap-2">
                    Adresse
                    <p-sortIcon field="address" />
                </div>
            </th>
            <th style="min-width: 10rem">Actions</th>
        </tr>
    </ng-template>

    <!-- TABLE BODY -->
    <ng-template pTemplate="body" let-client>
        <tr>
            <td>
                <p-tableCheckbox [value]="client" />
            </td>
            <td>{{ client.firstName }}</td>
            <td>{{ client.lastName }}</td>
            <td>{{ client.phone }}</td>
            <td>{{ client.address }}</td>
            <td>
                <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" (click)="editClient(client)" pTooltip="Modifier" />
                <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (click)="deleteClient(client)" pTooltip="Supprimer" />
            </td>
        </tr>
    </ng-template>

    <!-- EMPTY MESSAGE -->
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="6" class="text-center">Aucun client trouvé.</td>
        </tr>
    </ng-template>
</p-table>

<!-- EDIT/CREATE DIALOG -->
<p-dialog [(visible)]="articleDialog" [style]="{ width: '500px' }" [header]="getDialogTitle()" [modal]="true" [closable]="true" styleClass="client-dialog">
    <form [formGroup]="clientForm" class="flex flex-col gap-4" (ngSubmit)="onSubmit()">
        <!-- Name -->
        <div class="form-field">
            <label for="firstName" class="block font-bold mb-2"> Nom <span class="required">*</span> </label>
            <input id="firstName" type="text" pInputText formControlName="firstName" placeholder="Entrez le nom" class="w-full" />
            <small class="error-message" *ngIf="submitted && clientForm.get('firstName')?.invalid"> Le nom est obligatoire </small>
        </div>

        <!-- Last Name -->
        <div class="form-field">
            <label for="lastName" class="block font-bold mb-2"> Prénom <span class="required">*</span> </label>
            <input id="lastName" type="text" pInputText formControlName="lastName" placeholder="Entrez le prénom" class="w-full" />
            <small class="error-message" *ngIf="submitted && clientForm.get('lastName')?.invalid"> Le prénom est obligatoire </small>
        </div>

        <!-- Phone -->
        <div class="form-field">
            <label for="phone" class="block font-bold mb-2"> Téléphone <span class="required">*</span> </label>
            <input id="phone" type="text" pInputText formControlName="phone" placeholder="Entrez le numéro de téléphone" class="w-full" />
            <small class="error-message" *ngIf="submitted && clientForm.get('phone')?.invalid"> Le téléphone est obligatoire </small>
        </div>

        <!-- Address -->
        <div class="form-field">
            <label for="address" class="block font-bold mb-2"> Adresse <span class="required">*</span> </label>
            <input id="address" type="text" pInputText formControlName="address" placeholder="Entrez l'adresse" class="w-full" />
            <small class="error-message" *ngIf="submitted && clientForm.get('address')?.invalid"> L'adresse est obligatoire </small>
        </div>
    </form>

    <ng-template #footer>
        <div class="dialog-footer">
            <p-button label="Annuler" icon="pi pi-times" [text]="true" severity="secondary" (click)="hideDialog()" />
            <p-button [label]="getSaveButtonLabel()" [icon]="isEditMode ? 'pi pi-save' : 'pi pi-check'" severity="primary" (click)="onSubmit()" [disabled]="clientForm.invalid" />
        </div>
    </ng-template>
</p-dialog>

<p-confirmDialog [style]="{ width: '450px' }" />
<p-toast />
