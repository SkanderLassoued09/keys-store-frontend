<p-toast />

<p-toolbar class="mb-6">
    <ng-template #start>
        <h2 class="text-xl font-semibold m-0">Sous-catégories</h2>
    </ng-template>
    <ng-template #end>
        <p-button label="Nouvelle sous-catégorie" icon="pi pi-plus" (onClick)="openNew()" />
    </ng-template>
</p-toolbar>

<p-table [value]="(subCategories$ | async) || []" [loading]="(loading$ | async) || false" [rows]="10" [paginator]="true" [rowHover]="true" dataKey="_id" [tableStyle]="{ 'min-width': '40rem' }">
    <ng-template pTemplate="header">
        <tr>
            <th>Nom</th>
            <th>Catégorie parente</th>
            <th>Statut</th>
            <th style="width: 10rem">Actions</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-row>
        <tr>
            <td>{{ row.name }}</td>
            <td>{{ categoryName(row.category) }}</td>
            <td>
                <p-tag [value]="row.active === false ? 'Inactif' : 'Actif'" [severity]="row.active === false ? 'secondary' : 'success'" />
            </td>
            <td>
                <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info" (click)="openEdit(row)" pTooltip="Modifier" />
                <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (click)="remove(row)" pTooltip="Supprimer" />
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="4" class="text-center">Aucune sous-catégorie enregistrée.</td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="dialogVisible" [modal]="true" [closable]="true" [style]="{ width: '480px' }" [header]="isEditMode ? 'Modifier la sous-catégorie' : 'Nouvelle sous-catégorie'">
    <form [formGroup]="subCategoryForm" class="flex flex-col gap-4" (ngSubmit)="save()">
        <div class="flex flex-col gap-1">
            <label>Catégorie parente <span class="text-red-500">*</span></label>
            <p-select formControlName="category" [options]="(categories$ | async) || []" optionLabel="name" optionValue="_id" placeholder="Sélectionner une catégorie" [filter]="true" appendTo="body" class="w-full" />
            <small class="text-red-500" *ngIf="subCategoryForm.get('category')?.invalid && subCategoryForm.get('category')?.touched">La catégorie parente est obligatoire.</small>
        </div>

        <div class="flex flex-col gap-1">
            <label>Nom <span class="text-red-500">*</span></label>
            <input pInputText formControlName="name" placeholder="Ex: Clé plate" />
            <small class="text-red-500" *ngIf="subCategoryForm.get('name')?.invalid && subCategoryForm.get('name')?.touched">Le nom est obligatoire.</small>
        </div>

        <div class="flex items-center gap-2">
            <input id="sub-active" type="checkbox" formControlName="active" />
            <label for="sub-active" class="cursor-pointer">Sous-catégorie active</label>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <p-button label="Annuler" icon="pi pi-times" severity="secondary" [text]="true" (onClick)="closeDialog()" />
        <p-button label="Enregistrer" icon="pi pi-check" (onClick)="save()" [disabled]="subCategoryForm.invalid || (saving$ | async) || false" [loading]="(saving$ | async) || false" />
    </ng-template>
</p-dialog>

<p-confirmDialog [style]="{ width: '450px' }" />
